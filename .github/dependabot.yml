version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Major upgrades are not ignored: they arrive as individual PRs so each
    # can be reviewed (or closed with `@dependabot ignore this major version`),
    # and an ignore rule could also hide fixes that need a major upgrade.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
